<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#160b33" />
<meta name="description" content="JUMP TO THE STAR — Professor Shapi's Experiment #001. A physics arcade endless flight game about launching very unqualified animals into space." />
<title>JUMP TO THE STAR — JTTS</title>
<style>
/* ============================================================================
   JUMP TO THE STAR — UI skin
   Mad-science arcade: chunky ink outlines, warm brass, radioactive green.
   ========================================================================== */
:root {
  --ink: #241238;
  --ink-2: #160b33;
  --panel: rgba(26, 15, 48, 0.88);
  --panel-2: rgba(38, 21, 66, 0.92);
  --line: rgba(255, 255, 255, 0.14);
  --green: #7fe33f;
  --green-deep: #3f8a1f;
  --yellow: #ffd93b;
  --gold: #ffb020;
  --orange: #ff8a3d;
  --red: #ff4d6d;
  --cyan: #7ee8ff;
  --pink: #ff5ea8;
  --purple: #c58bff;
  --cream: #fff4d6;
  --font-display: "Arial Black", "Impact", "Segoe UI Black", system-ui, sans-serif;
  --font-body: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
  --shadow: 0 18px 40px rgba(4, 2, 12, 0.55);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #0b0620;
  color: var(--cream);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
  touch-action: none;
}

#app { position: fixed; inset: 0; overflow: hidden; }

#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: auto;
}

/* ------------------------------------------------------------------ screens */
.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  padding: clamp(14px, 2.4vw, 34px);
  overflow: auto;
  pointer-events: none;
  z-index: 5;
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(127, 227, 63, 0.10), transparent 70%),
    radial-gradient(900px 600px at 110% 110%, rgba(197, 139, 255, 0.16), transparent 70%),
    linear-gradient(180deg, rgba(10, 5, 26, 0.66), rgba(10, 5, 26, 0.9));
  backdrop-filter: blur(3px);
}
.screen.is-active { display: flex; pointer-events: auto; animation: fadeIn 0.28s ease both; }
.screen--modal { align-items: center; justify-content: center; }
.screen--menu {
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(900px 600px at 50% 0%, rgba(127, 227, 63, 0.16), transparent 65%),
    radial-gradient(800px 700px at 90% 100%, rgba(255, 94, 168, 0.16), transparent 70%),
    linear-gradient(180deg, rgba(10, 5, 26, 0.24), rgba(10, 5, 26, 0.72));
  backdrop-filter: none;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.screen-head { position: relative; margin-bottom: 10px; }
.screen-head h2 {
  font-family: var(--font-display);
  font-size: clamp(22px, 3.4vw, 42px);
  margin: 0 0 4px;
  color: var(--yellow);
  letter-spacing: 1px;
  text-shadow: 0 3px 0 #7a4b0a, 0 8px 22px rgba(0, 0, 0, 0.55);
}
.screen-head p { margin: 0; color: rgba(255, 244, 214, 0.72); font-size: clamp(12px, 1.4vw, 15px); }
.btn--back { position: absolute; right: 0; top: 0; }

/* ------------------------------------------------------------------ buttons */
.btn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 14px 22px;
  min-width: 160px;
  border-radius: 16px;
  border: 3px solid var(--ink);
  background: linear-gradient(180deg, #4a3470, #2b1b47 70%, #221539);
  color: var(--cream);
  font-family: var(--font-display);
  font-size: clamp(15px, 1.5vw, 19px);
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 6px 0 #120a24, 0 14px 26px rgba(0, 0, 0, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.16);
  transition: transform 0.09s ease, box-shadow 0.09s ease, filter 0.16s ease;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
}
.btn small {
  font-family: var(--font-body);
  font-size: 11px;
  letter-spacing: 0.4px;
  font-weight: 700;
  color: rgba(255, 244, 214, 0.62);
}
.btn:hover { transform: translateY(-2px) rotate(-0.4deg); filter: brightness(1.1); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #120a24, 0 6px 14px rgba(0, 0, 0, 0.4); }
.btn--primary {
  background: linear-gradient(180deg, #b6f36a, var(--green) 45%, #46a021);
  color: #10300a;
  border-color: #163d0a;
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.35);
  box-shadow: 0 7px 0 #215012, 0 16px 30px rgba(0, 0, 0, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.5);
}
.btn--primary small { color: rgba(16, 48, 10, 0.65); }
.btn--ghost { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.18); box-shadow: none; }
.btn--danger { background: linear-gradient(180deg, #ff8fa3, #e02e51); border-color: #4a0a18; color: #2a0510; font-size: 14px; margin-top: 8px; }
.btn:disabled { opacity: 0.45; filter: grayscale(0.6); cursor: not-allowed; transform: none; }

/* --------------------------------------------------------------------- menu */
.menu-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 860px; width: 100%; }
.brand { width: min(560px, 74vw); filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.5)); }
#logoCanvas { width: 100%; height: auto; display: block; }
.tagline {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(10px, 1.3vw, 14px);
  letter-spacing: 3px;
  color: var(--yellow);
  text-shadow: 0 2px 0 #3a2408;
}
.tagline--vi { font-family: var(--font-body); letter-spacing: 0.5px; font-size: clamp(10px, 1.1vw, 13px); color: rgba(255, 244, 214, 0.6); font-weight: 700; }
.menu-buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 560px; margin-top: 12px; }
.menu-row { display: flex; gap: 10px; }
.menu-row .btn { flex: 1; }
.menu-footer { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px;
  background: rgba(12, 6, 28, 0.7);
  border: 2px solid rgba(255, 255, 255, 0.16);
  font-size: 12px; font-weight: 800; letter-spacing: 1px; color: rgba(255, 244, 214, 0.85);
}
.chip b { color: var(--yellow); }
.chip--pilot { border-color: rgba(127, 227, 63, 0.5); color: var(--green); }
.credits { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 11px; color: rgba(255, 255, 255, 0.34); margin: 0; }

/* --------------------------------------------------------------- characters */
.char-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
  margin: 8px 0 12px;
}
.char-card {
  position: relative;
  border-radius: 18px;
  border: 3px solid rgba(255, 255, 255, 0.14);
  background: linear-gradient(180deg, rgba(60, 38, 96, 0.9), rgba(26, 15, 48, 0.95));
  padding: 8px 8px 10px;
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  overflow: hidden;
  min-height: 168px;
}
.char-card:hover { transform: translateY(-4px); border-color: rgba(255, 217, 59, 0.55); }
.char-card.is-selected { border-color: var(--green); box-shadow: 0 0 0 3px rgba(127, 227, 63, 0.22), 0 14px 30px rgba(0, 0, 0, 0.5); }
.char-card.is-locked { filter: saturate(0.45) brightness(0.8); }
.char-card canvas { width: 100%; height: 96px; display: block; }
.char-card .cc-name { font-family: var(--font-display); font-size: clamp(10px, 1.05vw, 13px); letter-spacing: 0.4px; text-align: center; margin-top: 2px; }
.char-card .cc-diff { text-align: center; font-size: 10px; font-weight: 800; letter-spacing: 1px; }
.char-card .cc-lock {
  position: absolute; inset: auto 0 0 0; padding: 6px; text-align: center;
  background: linear-gradient(0deg, rgba(10, 4, 22, 0.95), rgba(10, 4, 22, 0));
  font-size: 11px; font-weight: 900; color: var(--yellow); letter-spacing: 0.6px;
}
.char-card .cc-owned { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border-radius: 50%; background: var(--green); border: 2px solid #163d0a; }

.char-detail {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  gap: 14px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 14px 16px;
}
.char-detail h3 { margin: 0 0 2px; font-family: var(--font-display); font-size: clamp(18px, 2vw, 26px); color: var(--yellow); }
.char-detail .cd-skill { color: var(--cyan); font-weight: 900; letter-spacing: 1px; font-size: 13px; }
.char-detail p { margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: rgba(255, 244, 214, 0.82); }
.stat-bars { display: grid; gap: 6px; }
.stat-bar { display: grid; grid-template-columns: 84px 1fr 34px; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; color: rgba(255, 244, 214, 0.75); }
.stat-bar .track { height: 8px; border-radius: 6px; background: rgba(0, 0, 0, 0.45); overflow: hidden; }
.stat-bar .fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--green), var(--yellow)); }
.sw { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sw span { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; }
.sw .good { background: rgba(127, 227, 63, 0.14); color: #b6f36a; border: 1px solid rgba(127, 227, 63, 0.35); }
.sw .bad { background: rgba(255, 77, 109, 0.12); color: #ff9db0; border: 1px solid rgba(255, 77, 109, 0.35); }

/* ----------------------------------------------------------------- upgrades */
.wallet {
  position: absolute; right: 0; top: 0;
  background: rgba(12, 6, 28, 0.8); border: 2px solid rgba(255, 217, 59, 0.4);
  border-radius: 12px; padding: 6px 12px; font-family: var(--font-display); font-size: 20px; color: var(--yellow);
}
.wallet small { font-family: var(--font-body); font-size: 10px; color: rgba(255, 244, 214, 0.6); margin-left: 4px; letter-spacing: 1px; }
.upgrade-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.upgrade-tabs button {
  padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line);
  background: rgba(255, 255, 255, 0.05); color: var(--cream); font-weight: 900; font-size: 12px;
  letter-spacing: 0.6px; cursor: pointer; font-family: var(--font-body);
}
.upgrade-tabs button.is-active { border-color: var(--green); color: var(--green); background: rgba(127, 227, 63, 0.1); }
.upgrade-body { display: grid; grid-template-columns: 280px 1fr; gap: 14px; align-items: start; }
.upgrade-avatar {
  background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 10px; text-align: center;
  position: sticky; top: 0;
}
.upgrade-avatar canvas { width: 100%; height: auto; display: block; }
.upgrade-name { font-family: var(--font-display); font-size: 16px; color: var(--yellow); letter-spacing: 0.5px; }
.upgrade-stats { display: grid; gap: 4px; margin-top: 8px; text-align: left; font-size: 11px; color: rgba(255, 244, 214, 0.75); }
.upgrade-stats div { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); padding: 3px 0; }
.upgrade-stats b { color: var(--cyan); }
.upgrade-list { display: grid; gap: 8px; }
.up-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
}
.up-row h4 { margin: 0; font-family: var(--font-display); font-size: 14px; letter-spacing: 0.5px; }
.up-row p { margin: 2px 0 4px; font-size: 11.5px; color: rgba(255, 244, 214, 0.66); }
.pips { display: flex; gap: 4px; }
.pips i { width: 18px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.14); display: block; }
.pips i.on { background: linear-gradient(90deg, var(--green), var(--yellow)); box-shadow: 0 0 8px rgba(127, 227, 63, 0.6); }
.up-buy {
  min-width: 108px; padding: 10px 12px; border-radius: 12px; border: 2px solid #163d0a;
  background: linear-gradient(180deg, #b6f36a, #46a021); color: #10300a; font-weight: 900; cursor: pointer;
  font-family: var(--font-body); box-shadow: 0 4px 0 #215012;
}
.up-buy:disabled { background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.4); border-color: rgba(255, 255, 255, 0.12); box-shadow: none; cursor: not-allowed; }
.up-buy small { display: block; font-size: 10px; opacity: 0.7; }

/* ------------------------------------------------------------------ records */
.records-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.record-card {
  background: linear-gradient(180deg, rgba(58, 35, 92, 0.9), rgba(22, 12, 42, 0.95));
  border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
}
.record-label { font-size: 10.5px; letter-spacing: 1.4px; color: rgba(255, 244, 214, 0.55); font-weight: 900; }
.record-card b { font-family: var(--font-display); font-size: clamp(18px, 2.2vw, 26px); color: var(--yellow); }
.records-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.panel h3 { margin: 0 0 8px; font-family: var(--font-display); font-size: 14px; letter-spacing: 1px; color: var(--cyan); }
.best-list div, .history div { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; border-bottom: 1px dashed rgba(255, 255, 255, 0.08); }
.best-list b, .history b { color: var(--yellow); }
.history .h-empty { color: rgba(255, 255, 255, 0.4); font-size: 12px; }
.achievements { display: grid; gap: 5px; }
.ach { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: rgba(255, 255, 255, 0.5); }
.ach.on { color: var(--green); }
.ach .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.18); flex: 0 0 auto; }
.ach.on .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }

/* ----------------------------------------------------------------- settings */
.settings-wrap { max-width: 720px; width: 100%; margin: 0 auto; display: grid; gap: 12px; align-content: start; }
.slider-row { display: grid; grid-template-columns: 120px 1fr 56px; align-items: center; gap: 10px; font-weight: 900; font-size: 12px; letter-spacing: 1px; }
input[type="range"] { -webkit-appearance: none; appearance: none; height: 10px; border-radius: 6px; background: linear-gradient(90deg, var(--green), var(--yellow)); outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff4d6; border: 3px solid var(--ink); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); cursor: pointer; }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff4d6; border: 3px solid var(--ink); cursor: pointer; }
.slider-row output { text-align: right; color: var(--yellow); font-family: var(--font-display); font-size: 13px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 900; font-size: 12px; letter-spacing: 1px; }
.segmented { display: flex; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
.segmented button { background: rgba(255, 255, 255, 0.05); color: rgba(255, 244, 214, 0.7); border: none; padding: 8px 14px; font-weight: 900; font-size: 11px; cursor: pointer; letter-spacing: 0.6px; }
.segmented button.is-active { background: linear-gradient(180deg, #b6f36a, #46a021); color: #10300a; }
.switch-row { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 12px; letter-spacing: 1px; }
.switch-row input { width: 22px; height: 22px; accent-color: var(--green); }
.settings-note { font-size: 11.5px; color: rgba(255, 244, 214, 0.5); line-height: 1.5; margin: 4px 0 20px; }

/* -------------------------------------------------------------------- modal */
.modal {
  width: min(640px, 94vw);
  background: linear-gradient(180deg, rgba(46, 27, 78, 0.97), rgba(18, 9, 36, 0.98));
  border: 3px solid var(--ink);
  border-radius: 24px;
  box-shadow: var(--shadow), inset 0 2px 0 rgba(255, 255, 255, 0.12);
  padding: clamp(18px, 3vw, 30px);
  text-align: center;
  position: relative;
  max-height: 94vh;
  overflow: auto;
}
.modal h2 { margin: 6px 0 4px; font-family: var(--font-display); font-size: clamp(30px, 5vw, 52px); color: var(--yellow); text-shadow: 0 4px 0 #7a4b0a, 0 12px 26px rgba(0, 0, 0, 0.5); letter-spacing: 1px; }
.modal-sub { margin: 0 0 14px; color: rgba(255, 244, 214, 0.7); font-size: 13px; }
.modal-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
.modal-buttons .btn { min-width: 130px; padding: 12px 16px; font-size: 15px; }
.ribbon {
  display: inline-block; padding: 6px 18px; transform: rotate(-2deg);
  background: linear-gradient(180deg, #ff8a3d, #e0392c); border: 3px solid #4a0a18; border-radius: 10px;
  font-family: var(--font-display); font-size: 13px; letter-spacing: 2px; color: #fff4d6;
  box-shadow: 0 6px 0 #4a0a18;
}
.ribbon.is-record { background: linear-gradient(180deg, #ffe86b, #ff9f1c); color: #4a2a06; }
.result-distance { display: flex; flex-direction: column; gap: 2px; margin: 6px 0 14px; }
.result-distance b { font-family: var(--font-display); font-size: clamp(38px, 7vw, 66px); color: #fff; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.4); line-height: 1; }
.result-distance span { font-size: 12px; letter-spacing: 2px; color: var(--cyan); font-weight: 900; }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.result-grid div { background: rgba(0, 0, 0, 0.28); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 6px; display: flex; flex-direction: column; gap: 3px; }
.result-grid span { font-size: 9.5px; letter-spacing: 1px; color: rgba(255, 244, 214, 0.55); font-weight: 900; }
.result-grid b { font-family: var(--font-display); font-size: 18px; color: var(--yellow); }
.shapi-quote { font-style: italic; font-size: 12.5px; color: rgba(255, 244, 214, 0.62); margin: 14px 0 0; }
.map-panel { display: none; margin-top: 14px; text-align: left; }
.map-panel.is-open { display: block; }
.map-region { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); }
.map-region .dot { width: 12px; height: 12px; border-radius: 50%; }
.map-region b { margin-left: auto; color: var(--yellow); }
.map-track { height: 12px; border-radius: 8px; background: linear-gradient(90deg, #7fe33f, #ffd93b 25%, #7ee8ff 50%, #ff8a3d 75%, #c58bff); position: relative; margin: 10px 0 6px; }
.map-track i { position: absolute; top: -6px; width: 6px; height: 24px; background: #fff; border-radius: 3px; box-shadow: 0 0 10px #fff; }

/* ------------------------------------------------------------ touch + misc */
.touch { position: absolute; inset: auto 0 0 0; display: none; justify-content: space-between; padding: 10px clamp(10px, 3vw, 26px) clamp(10px, 3vw, 26px); z-index: 4; pointer-events: none; }
.touch.is-on { display: flex; }
.touch-left, .touch-right { display: flex; gap: 12px; align-items: flex-end; pointer-events: auto; }
.tbtn {
  width: calc(74px * var(--touch-scale, 1));
  height: calc(74px * var(--touch-scale, 1));
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.28);
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.28), rgba(20, 10, 40, 0.62) 70%);
  color: #fff; font-size: 22px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center;
  backdrop-filter: blur(4px); touch-action: none; cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
}
.tbtn.is-down { background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.5), rgba(255, 181, 32, 0.7) 70%); transform: scale(0.96); }
.tbtn small { font-size: 9px; letter-spacing: 1px; margin-top: 2px; opacity: 0.8; }
.tbtn--boost { width: calc(92px * var(--touch-scale, 1)); height: calc(92px * var(--touch-scale, 1)); border-color: rgba(255, 217, 59, 0.6); background: radial-gradient(circle at 35% 30%, rgba(255, 246, 176, 0.55), rgba(255, 138, 61, 0.7) 70%); color: #3a1a02; }
.tbtn--skill { border-color: rgba(126, 232, 255, 0.55); background: radial-gradient(circle at 35% 30%, rgba(191, 247, 255, 0.45), rgba(74, 125, 255, 0.62) 70%); }
.pause-fab {
  position: absolute; top: 14px; right: 14px; z-index: 30; width: 46px; height: 46px; border-radius: 12px;
  border: 2px solid rgba(255, 255, 255, 0.22); background: rgba(20, 10, 40, 0.66); color: #fff; font-size: 14px;
  cursor: pointer; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px);
}
.pause-fab.is-on { display: flex; }
.fs-fab {
  position: absolute; top: 66px; right: 14px; z-index: 30; width: 46px; height: 46px; border-radius: 12px;
  border: 2px solid rgba(255, 255, 255, 0.18); background: rgba(20, 10, 40, 0.5); color: rgba(255, 255, 255, 0.8);
  cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px;
  backdrop-filter: blur(4px); opacity: 0.55; transition: opacity 0.15s ease;
}
.fs-fab:hover, .fs-fab:focus-visible { opacity: 1; }
@media (pointer: coarse) {
  .fs-fab { width: 40px; height: 40px; top: 62px; right: 12px; opacity: 0.8; }
}
.fps-readout {
  position: absolute; top: 118px; right: 16px; z-index: 30; font-size: 11px; font-weight: 900;
  color: #9ff7a0; background: rgba(0, 0, 0, 0.4); padding: 3px 8px; border-radius: 8px; display: none;
}
.fps-readout.is-on { display: block; }

.loading { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: #0b0620; transition: opacity 0.5s ease; }
.loading.is-done { opacity: 0; pointer-events: none; }
.loading-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; font-family: var(--font-display); letter-spacing: 2px; font-size: 13px; color: var(--yellow); }
.loading .bar { width: 240px; height: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.loading .bar i { display: block; height: 100%; width: 40%; border-radius: 6px; background: linear-gradient(90deg, var(--green), var(--yellow)); animation: load 1.1s ease-in-out infinite; }
@keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }

/* ---------------------------------------------------------------- responsive */
@media (max-width: 900px) {
  .char-grid { grid-template-columns: repeat(3, 1fr); }
  .char-detail { grid-template-columns: 1fr; }
  .upgrade-body { grid-template-columns: 1fr; }
  .upgrade-avatar { position: static; display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; }
  .upgrade-avatar canvas { width: 120px; height: 120px; }
  .btn--back { position: static; margin-top: 8px; align-self: flex-start; }
}
@media (max-width: 640px) {
  .char-grid { grid-template-columns: repeat(2, 1fr); }
  .menu-row { flex-direction: column; }
  .result-grid { grid-template-columns: repeat(2, 1fr); }
  .settings-wrap { gap: 10px; }
  .slider-row { grid-template-columns: 96px 1fr 46px; font-size: 11px; }
  .screen { padding: 12px; }
  .credits { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .screen.is-active { animation: none; }
  .loading .bar i { animation: none; width: 100%; }
}

/* fullscreen as a menu row button */
.chip--btn {
  font: inherit; cursor: pointer; letter-spacing: 1px;
  border: 2px solid rgba(255, 255, 255, 0.22); color: #fff; background: rgba(255, 255, 255, 0.06);
  transition: background 0.15s ease, transform 0.12s ease;
}
.chip--btn:hover { background: rgba(255, 255, 255, 0.14); transform: translateY(-1px); }

/* ---------------------------------------------------- open in new tab button */
.btn--open {
  width: 100%; margin-top: 4px;
  background: linear-gradient(180deg, rgba(126, 232, 255, 0.18), rgba(126, 232, 255, 0.06));
  border-color: rgba(126, 232, 255, 0.5) !important;

}
.btn--open:hover { background: linear-gradient(180deg, rgba(126, 232, 255, 0.3), rgba(126, 232, 255, 0.12)); }
.btn--open span { color: #7ee8ff; }

/* --------------------------------------------------------- standalone gate */
.standalone {
  position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 40%, #24114d 0%, #0b0620 70%);

.standalone[hidden] { display: none; }
.standalone-card {

  function readStoredLang() {

      const store = typeof localStorage !== "undefined" ? localStorage : null;

      return LANGS.includes(stored) ? stored : null;

    }
  }

      const store = typeof localStorage !== "undefined" ? localStorage : null;
      if (store) store.setItem("jtts.lang", value);

    } catch (_) {
      return false;
    }
  }

    }

  function applyDrag(p, dt, dragMul = 1) {
    const speed = Math.abs(p.vx);
    const over = speed - PHYS.vxDragFloor;
    if (over > 0) p.vx -= Math.sign(p.vx) * PHYS.vxDrag * over * dragMul * dt;
    p.vx *= 1 - 0.02 * dragMul * dt;
  }
  function applyGravity(p, dt, gravityMul = 1, extra = 0) {
    const g = Math.min(PHYS.gravityCap, PHYS.gravity * gravityMul + extra);
    p.vy = Math.min(PHYS.maxFallSpeed, p.vy + g * dt);
  }
  function clampSpeed(p, cap) {
    const c = cap || PHYS.maxVx;
    if (p.vx > c) p.vx = c;
    if (p.vx < -c * 0.72) p.vx = -c * 0.72;
    if (p.vy < -PHYS.maxVyUp) p.vy = -PHYS.maxVyUp;
    if (p.vy > PHYS.maxFallSpeed) p.vy = PHYS.maxFallSpeed;
  }

  // src/game/flight.js
  function stepFlight(p, dt, opts = {}) {
    const gravityMul = opts.gravityMul ?? 1;
    const dragMul = opts.dragMul ?? 1;
    applyGravity(p, dt, gravityMul, opts.extraGravity || 0);
    applyDrag(p, dt, dragMul);
    if (opts.fallCap != null && p.vy > opts.fallCap) p.vy = opts.fallCap;
    clampSpeed(p, opts.vxCap || PHYS.maxVx);
  }

  // src/game/bounce.js
  function resolvePadBounce(def, vx, vy, nx, ny, mul = 1, opts = {}) {
    const vn = vx * nx + vy * ny;
    if (vn >= 0.5) return null;
    const friction = def.id === "ice" ? 0.01 : 0.06;
    const bounceMul = opts.bounceMul ?? 1;
    const up = (def.fixedUp ?? 1200) * bounceMul * (0.55 + 0.45 * mul);
    const vtx = vx - vn * nx;
    const vty = vy - vn * ny;
    let outVx = vtx * (1 - friction) + nx * up;
    let outVy = vty * (1 - friction) + ny * up;
    if (def.vxBonus) outVx += def.vxBonus * mul * (opts.itemMul ?? 1);
    const minVx = opts.minVx ?? 0;
    if (minVx > 0 && outVx < minVx) outVx = minVx;
    return {
      vx: clamp(outVx, -PHYS.maxVx * 0.8, PHYS.maxVx),
      vy: clamp(outVy, -PHYS.maxVyUp, PHYS.maxFallSpeed)
    };
  }
  function padContact(p, x0, y0, radius, pads) {
    let best = null;
    for (const pad of pads) {
      const nx = pad.nx ?? 0;
      const ny = pad.ny ?? -1;
      const dPrev = (x0 - pad.x) * nx + (y0 - pad.y) * ny;
      const dNow = (p.x - pad.x) * nx + (p.y - pad.y) * ny;
      if (!(dNow < dPrev)) continue;
      const vn = p.vx * nx + p.vy * ny;
      if (vn >= 0) continue;
      const cos = Math.cos(pad.angle || 0);
      const sin = Math.sin(pad.angle || 0);
      const along = (p.x - pad.x) * cos + (p.y - pad.y) * sin;
      const halfW = pad.w / 2 + radius * 0.3;
      if (Math.abs(along) > halfW) continue;
      const catchDepth = pad.catch ?? 0;
      const surface = radius + 4;
      if (dNow > surface + catchDepth) continue;
      const depth = Math.max(0, surface - dNow);
      if (!best || depth < best.depth) {
        best = { pad, nx, ny, depth, along };
      }
    }
    return best;
  }

  var ScoreTracker = class {

      this.pickups = 0;

    get metres() {
      return Math.max(0, (this.maxX - this.startX) / PX_PER_METER);
    }
    get score() {
      return Math.floor(this.distanceScore + this.collectionScore + this.comboScore + this.skillScore);
    }
    updateMax(x) {
      if (x > this.maxX) {
        this.maxX = x;
        this.distanceScore = this.metres * ECONOMY.distanceScore;
      }
    }
    /** Pickups award points once each (the game removes them from the world). */
    addPickup(def) {
      const pts = def.score || 0;
      this.collectionScore += pts;
      this.pickups++;
      if (def.coins) this.coins += def.coins;
      this.addCombo(def.combo || 0);
    }
    addCoins(n) {

      this.addCombo(1);
      return label;
    }
    /** Returns {combo, tierUp, label, colour} so the HUD can celebrate. */
    addCombo(amount = 1) {
      if (amount <= 0) return null;
      this.combo += amount;
      this.actions++;
      this.comboTimer = 2.8;
      this.comboScore += ECONOMY.comboScore * amount * 0.25;
      if (this.combo > this.bestCombo) this.bestCombo = this.combo;
      let tier = 0;
      for (let i = 0; i < COMBO_TIERS.length; i++) {
        if (this.combo >= COMBO_TIERS[i].at) tier = i + 1;
      }
      if (tier > this.tierIndex) {
        this.tierIndex = tier;
        const tierDef = COMBO_TIERS[tier - 1];
        const label = t(`combo.${tier}`);
        this.lastTierLabel = label;
        return { combo: this.combo, tier, tierUp: true, label, colour: tierDef.colour };
      }
      return { combo: this.combo, tier, tierUp: false };

        distanceScore: Math.floor(this.distanceScore),
        collectionScore: Math.floor(this.collectionScore),
        comboScore: Math.floor(this.comboScore),
        skillScore: Math.floor(this.skillScore),
        score: this.score,
        bestCombo: this.bestCombo,
        coins: this.coins,
        pickups: this.pickups,

    }
  };

  var MAX_PARTICLES = 900;
  var Particles = class {
    constructor() {
      this.pool = new Array(MAX_PARTICLES);
      for (let i = 0; i < MAX_PARTICLES; i++) {
        this.pool[i] = {
          active: false,
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          life: 0,
          maxLife: 1,
          size: 4,
          colour: "#fff",
          kind: "spark",
          gravity: 0,
          drag: 1,
          rot: 0,
          vr: 0,
          glow: false,
          alpha: 1
        };
      }
      this.cursor = 0;
      this.budget = 1;
      this.count = 0;
    }
    clear() {
      for (const p of this.pool) p.active = false;
      this.count = 0;
    }
    spawn(cfg) {
      if (this.budget <= 0) return null;
      const max = Math.floor(MAX_PARTICLES * clamp01(this.budget));
      for (let i = 0; i < max; i++) {
        this.cursor = (this.cursor + 1) % max;
        const p = this.pool[this.cursor];
        if (p.active) continue;
        p.active = true;
        p.x = cfg.x;
        p.y = cfg.y;
        p.vx = cfg.vx || 0;
        p.vy = cfg.vy || 0;
        p.maxLife = cfg.life || 0.6;
        p.life = p.maxLife;
        p.size = cfg.size || 4;
        p.colour = cfg.colour || "#fff";
        p.kind = cfg.kind || "spark";
        p.gravity = cfg.gravity || 0;
        p.drag = cfg.drag ?? 1.6;
        p.rot = cfg.rot || 0;
        p.vr = cfg.vr || 0;
        p.glow = !!cfg.glow;
        p.alpha = cfg.alpha ?? 1;
        this.count++;
        return p;
      }
      return null;
    }
    burst(x, y, count, cfg = {}) {
      const n = Math.round(count * (0.4 + 0.6 * this.budget));
      for (let i = 0; i < n; i++) {
        const a = cfg.angle != null ? cfg.angle + (Math.random() - 0.5) * (cfg.spread || 0.8) : Math.random() * Math.PI * 2;
        const sp = (cfg.speed || 300) * (0.35 + Math.random() * 0.9);
        this.spawn({
          x: x + (Math.random() - 0.5) * (cfg.jitter || 0),
          y: y + (Math.random() - 0.5) * (cfg.jitter || 0),
          vx: Math.cos(a) * sp + (cfg.biasX || 0),
          vy: Math.sin(a) * sp + (cfg.biasY || 0),
          life: (cfg.life || 0.6) * (0.6 + Math.random() * 0.8),
          size: (cfg.size || 5) * (0.6 + Math.random() * 0.9),
          colour: Array.isArray(cfg.colour) ? cfg.colour[Math.floor(Math.random() * cfg.colour.length)] : cfg.colour || "#fff",
          kind: cfg.kind || "spark",
          gravity: cfg.gravity ?? 900,
          drag: cfg.drag ?? 1.2,
          glow: cfg.glow,
          rot: Math.random() * 6.28,
          vr: (Math.random() - 0.5) * 12
        });
      }
    }
    update(dt) {
      this.count = 0;
      for (const p of this.pool) {
        if (!p.active) continue;
        p.life -= dt;
        if (p.life <= 0) {
          p.active = false;
          continue;
        }
        const d = 1 / (1 + p.drag * dt);
        p.vx *= d;
        p.vy = p.vy * d + p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        this.count++;
      }
    }
    draw(ctx2, cam) {
      const left = cam.left - 120;
      const right = cam.left + cam.visibleWidth() + 120;
      const top = cam.top - 120;
      const bottom = cam.top + cam.visibleHeight() + 120;
      ctx2.save();
      for (const p of this.pool) {
        if (!p.active) continue;
        if (p.x < left || p.x > right || p.y < top || p.y > bottom) continue;
        const t2 = clamp01(p.life / p.maxLife);
        const alpha = t2 * p.alpha;
        ctx2.globalAlpha = alpha;
        ctx2.fillStyle = p.colour;
        if (p.glow) {
          ctx2.shadowColor = p.colour;
          ctx2.shadowBlur = p.size * 2.4;
        } else {
          ctx2.shadowBlur = 0;
        }
        switch (p.kind) {
          case "ring": {
            ctx2.globalAlpha = alpha * 0.7;
            ctx2.strokeStyle = p.colour;
            ctx2.lineWidth = Math.max(1, p.size * 0.14 * t2);
            ctx2.beginPath();
            ctx2.arc(p.x, p.y, p.size * (1.6 - t2 * 1.2), 0, Math.PI * 2);
            ctx2.stroke();
            break;
          }
          case "smoke": {
            ctx2.globalAlpha = alpha * 0.5;
            ctx2.beginPath();
            ctx2.arc(p.x, p.y, p.size * (1.5 - t2 * 0.5), 0, Math.PI * 2);
            ctx2.fill();
            break;
          }
          case "star": {
            drawStar(ctx2, p.x, p.y, p.size * (0.5 + t2 * 0.8), p.rot);
            break;
          }
          case "streak": {
            ctx2.globalAlpha = alpha * 0.85;
            ctx2.lineWidth = p.size * 0.5;
            ctx2.strokeStyle = p.colour;
            ctx2.beginPath();
            ctx2.moveTo(p.x, p.y);
            ctx2.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03);
            ctx2.stroke();
            break;
          }
          default: {
            ctx2.beginPath();
            ctx2.arc(p.x, p.y, p.size * (0.35 + t2 * 0.75), 0, Math.PI * 2);
            ctx2.fill();
          }
        }
      }
      ctx2.restore();
    }
  };
  function drawStar(ctx2, x, y, r, rot) {
    ctx2.beginPath();

      const a = rot + i * Math.PI / 5;
      const rr2 = i % 2 === 0 ? r : r * 0.45;
      const px = x + Math.cos(a) * rr2;
      const py = y + Math.sin(a) * rr2;
      if (i === 0) ctx2.moveTo(px, py);
      else ctx2.lineTo(px, py);
    }
    ctx2.closePath();
    ctx2.fill();
  }

  var Camera = class {

    }
    snapTo(px, py) {

    addShake(amount) {

      this.shake = Math.min(1.4, this.shake + amount);
    }
    pulseZoom(amount) {
      this.zoomPulse = Math.min(0.09, this.zoomPulse + amount);
    }
    update(dt, player, opts = {}) {
      const speed = Math.max(0, player.vx);
      const lead = clamp(speed * CAMERA.lookAhead * 0.32, 0, CAMERA.lookAheadMax);
      this.leadX += (lead - this.leadX) * damp(2.4, dt);
      const aimX = player.x + this.leadX + this.vw * 0.055;
      const aimY = player.y + clamp(player.vy * 0.11, -140, 190);
      this.x += (aimX - this.x) * damp(CAMERA.smoothX, dt);
      this.y += (aimY - this.y) * damp(CAMERA.smoothY, dt);
      const speedZoom = clamp01((speed - 900) / 1800) * 0.055;
      this.targetZoom = this.baseZoom * (1 - speedZoom - this.zoomPulse);
      if (opts.zoomOut) this.targetZoom *= 0.96;
      this.zoom += (this.targetZoom - this.zoom) * damp(CAMERA.zoomSpeed, dt);
      this.zoomPulse *= 1 - damp(3.4, dt);
      this.shake *= 1 - damp(CAMERA.shakeDecay, dt);
      if (this.shake < 2e-3) this.shake = 0;
      const s = this.shake * this.shake * 26;

      this.shakeY = (Math.random() * 2 - 1) * s;

      return {

      return this.vw / this.zoom;
    }

              colour: "#fff7e8",
              kind: "spark",
              gravity: 380,
              rot: Math.random() * 6,
              vr: 6
            });
          }
          break;
        }
        case "cheeseMagnet": {
          if (p.energy <= 0) break;
          p.energy = Math.max(0, p.energy - 0.6 * dt);
          this.pullLoot(560, 1500, dt, true);
          let nearest = null;
          let bestD = 1e9;
          for (const it of this.world.itemsNear(p.x)) {
            if (it.kind !== "pickup" || it.taken) continue;
            const d = Math.hypot(it.x - p.x, it.y - p.y);
            if (d < bestD) {
              bestD = d;
              nearest = it;
            }
          }
          if (nearest && bestD < 900) {
            const dx = nearest.x - p.x;
            const dy = nearest.y - p.y;
            const l = Math.hypot(dx, dy) || 1;
            p.vx += dx / l * 240 * dt;
            p.vy += dy / l * 240 * dt;
          }
          this.audio?.sfx("zap", { throttle: 0.3, volume: 0.35 });
          if (Math.random() < 0.7) {
            const a = Math.random() * 6.28;
            this.particles.spawn({
              x: p.x + Math.cos(a) * 130,
              y: p.y + Math.sin(a) * 130,
              vx: -Math.cos(a) * 280,
              vy: -Math.sin(a) * 280,
              life: 0.4,
              size: 4,
              colour: "#ffd93b",
              kind: "spark",
              gravity: 0,
              glow: true
            });
          }
          break;
        }
        case "meteorSlam": {
          p.diveTimer = 0.85;
          p.diveActive = true;
          p.skillCooldown = skill.cooldown;
          p.vy = Math.max(p.vy, 260);
          this.audio?.sfx("thoomp");
          this.camera.addShake(0.2);
          this.particles.spawn({ x: p.x, y: p.y, vx: 0, vy: 0, life: 0.5, size: 90, colour: "#ff8a3d", kind: "ring", gravity: 0, drag: 0 });
          break;
        }
        case "glitchBoost": {
          const mode = GLITCH_MODES[p.glitchMode];
          p.glitchMode = (p.glitchMode + 1) % GLITCH_MODES.length;
          p.glitchFlash = 1;
          p.skillCooldown = skill.cooldown;
          this.audio?.sfx("glitch");
          this.camera.addShake(0.22);
          this.particles.spawn({ x: p.x, y: p.y, vx: 0, vy: 0, life: 0.45, size: 110, colour: "#c58bff", kind: "ring", gravity: 0, drag: 0 });
          if (mode === "POWER") {
            p.vy = Math.min(p.vy, -1250 * s.skillPower);
            p.vx = Math.min(PHYS.maxVx, p.vx + 420);
            this.addFloater("POWER!", p.x, p.y - 100, "#ff7a3d", 26, 0.9);
            this.particles.burst(p.x, p.y, 24, { colour: ["#ff7a3d", "#ffd93b"], speed: 520, life: 0.5, size: 7, gravity: 200, glow: true });
          } else if (mode === "CONTROL") {
            const axis = input2?.axis || 1;
            p.vx += axis * 720;
            p.vy = axis > 0 ? Math.min(p.vy, 80) * 0.4 : p.vy * 0.55;
            p.buffs.control = 1.6;
            this.addFloater("CONTROL!", p.x, p.y - 100, "#7ee8ff", 26, 0.9);
            this.particles.burst(p.x, p.y, 20, { colour: ["#7ee8ff", "#bff7ff"], speed: 480, life: 0.5, size: 6, gravity: 0, glow: true });
          } else {
            p.vy = Math.min(p.vy, -320);
            p.buffs.recovery = 1.8;
            this.addFloater("RECOVERY!", p.x, p.y - 100, "#9ff7a0", 26, 0.9);
            this.particles.burst(p.x, p.y, 20, { colour: ["#9ff7a0", "#ffffff"], speed: 380, life: 0.6, size: 6, gravity: 0, glow: true });
          }
          break;
        }
        default:
          break;
      }
      if (def.sfx && skill.id !== "glitchBoost" && skill.id !== "bioSpring") this.audio?.sfx(def.sfx, { volume: 0.7 });
    }
    /** Attract nearby pickups toward the player (cheese skill / reverse magnet). */
    pullLoot(radius, force, dt, strong = false) {
      const p = this.player;
      for (const it of this.world.itemsNear(p.x)) {
        if (it.taken || it.kind !== "pickup") continue;
        const dx = p.x - it.x;
        const dy = p.y - it.y;
        const d = Math.hypot(dx, dy);
        if (d > radius || d < 1) continue;
        const f = force * (1 - d / radius) * dt;
        it.x += dx / d * f;
        it.y += dy / d * f;
        it.pulled = true;
        if (strong && Math.random() < 0.08) {
          this.particles.spawn({
            x: it.x,
            y: it.y,
            vx: (Math.random() - 0.5) * 80,
            vy: (Math.random() - 0.5) * 80,
            life: 0.3,
            size: 3,
            colour: "#ffd93b",
            kind: "spark",
            gravity: 0,
            glow: true
          });
        }
      }
    }
    // ------------------------------------------------------------- collisions
    hitPad(contact, diving) {
      const p = this.player;
      const s = this.stats;
      const { pad, nx, ny } = contact;
      const def = ITEM_DEFS[pad.id];
      const isRescue = !!pad.rescue;
      const skillBuff = p.springBuff > 0;
      const out = resolvePadBounce(def, p.vx, p.vy, nx, ny, s.itemMul, {
        bounceMul: s.bounceMul * (skillBuff ? 1.12 : 1),
        minVx: isRescue ? 1020 : 950,
        itemMul: s.itemMul
      });
      if (!out) return;
      const impactSpeed = Math.hypot(p.vx, p.vy);
      p.vx = out.vx;
      p.vy = out.vy;
      const surf = PHYS.collideRadius + 5;
      const d = (p.x - pad.x) * nx + (p.y - pad.y) * ny;
      p.x += nx * (surf - d);
      p.y += ny * (surf - d);
      p.squash = 1.25;
      p.stretch = 0.82;
      p.lastPadAt = 0;
      this.runStats.springs++;
      if (isRescue) this.runStats.nets = (this.runStats.nets || 0) + 1;
      else this.runStats.padHits = (this.runStats.padHits || 0) + 1;
      this.camera.addShake(isRescue ? 0.15 : 0.22);
      this.audio?.sfx(def.sound || "boing", { pitch: 0.9 + Math.random() * 0.25, volume: isRescue ? 0.8 : 1 });
      if (diving || p.diveTimer > 0) {
        const power = clamp(impactSpeed / 900, 0.6, 2.2);
        const bonus = 560 * power * s.skillPower;
        p.vy = Math.max(-PHYS.maxVyUp, p.vy - bonus);
        p.vx = Math.min(PHYS.maxVx, p.vx + 220 * power);
        p.diveTimer = 0;
        p.diveActive = false;
        this.score.addSkillBonus(Math.round(80 + 90 * power), "METEOR CONVERSION");
        this.addFloater(`METEOR LAUNCH! +${Math.round(80 + 90 * power)}`, p.x, p.y - 130, "#ff9a3d", 28, 1.4);
        this.camera.addShake(0.6);
        this.camera.pulseZoom(0.05);
        this.particles.burst(p.x, p.y + 30, 34, {
          colour: ["#ff9a3d", "#ffd93b", "#ffffff"],
          speed: 720,
          life: 0.7,
          size: 8,
          gravity: 320,
          glow: true
        });
        this.particles.spawn({ x: p.x, y: p.y + 20, vx: 0, vy: 0, life: 0.6, size: 180, colour: "#ff9a3d", kind: "ring", gravity: 0, drag: 0 });
      }
      if (isRescue) {
        this.score.breakCombo();
        p.energy = Math.max(0, p.energy - p.energyMax * 0.08);
        this.addFloater("SAFETY NET! -8%", p.x, p.y - 110, "#9ff7a0", 26, 1.2);
      } else {
        const chain = this.score.addCombo(1);
        if (chain) this.onCombo(chain, p);
        this.particles.burst(p.x, p.y + 34, 14, {
          colour: ["#ffffff", def.colour || "#ffd93b"],
          speed: 300,
          angle: Math.PI / 2,
          spread: 1.8,
          life: 0.4,
          size: 5,
          gravity: 520,
          glow: true
        });
        this.addFloater(pick(def, "name"), p.x, p.y - 96, "#ffffff", 18, 0.8);
        if (p.y < this.world.floorAt(p.x) - 1300) {
          this.audio?.sfx("ooh", { volume: 0.5, crowd: 2, pitch: 1.1 });
        }
      }
      p.springBuff = Math.max(0, (p.springBuff || 0) - 0.3);
      this.screenFlash = Math.min(1, (this.screenFlash || 0) + 0.18);
    }
    collectNearby(dt) {
      const p = this.player;
      if (p.buffs.magnet > 0) this.pullLoot(430, 900, dt, false);
      const radius = PHYS.collideRadius;
      for (const it of this.world.itemsNear(p.x)) {
        if (it.taken) continue;
        const def = ITEM_DEFS[it.id];
        if (!def) continue;
        const d2 = (it.x - p.x) ** 2 + (it.y - p.y) ** 2;
        const rr2 = radius + (def.r || 24) * 0.9;
        if (d2 > rr2 * rr2) continue;
        this.consumeItem(it, def);
      }
    }
    consumeItem(it, def) {
      const p = this.player;
      this.world.removeItem(it);
      this.score.addPickup(def);
      if (def.energy) p.energy = Math.min(p.energyMax, p.energy + def.energy);
      if (def.boost) {
        p.boosts = Math.min(p.maxBoosts, p.boosts + def.boost);
        this.addFloater("+1 BOOST!", it.x, it.y - 40, "#ffe86b", 26, 1.1);
        this.camera.addShake(0.12);
      }
      if (def.buff) {
        p.buffs[def.buff] = Math.max(p.buffs[def.buff] || 0, def.duration);
        this.addFloater(def.name, it.x, it.y - 44, def.colour, 22, 1.2);
      }
      if (def.kind === "booster") {
        p.vx = Math.min(PHYS.maxVx, p.vx + (def.vx || 0));
        p.vy = (def.vy || 0) + Math.min(p.vy, 0) * 0.4;
        p.boostPulse = 1;
        this.camera.addShake(0.3);
        this.camera.pulseZoom(0.04);
        this.particles.burst(it.x, it.y, 22, {
          colour: ["#ffd93b", "#ff7a3d", "#ffffff"],
          speed: 520,
          life: 0.55,
          size: 7,
          gravity: 240,
          glow: true
        });
      }
      if (def.id === "coin") {
        this.audio?.sfx("coin", { pitch: 0.95 + Math.random() * 0.2, throttle: 0.03 });
      } else {
        this.audio?.sfx(def.sound || "pop", { pitch: 0.95 + Math.random() * 0.2 });
      }
      this.particles.burst(it.x, it.y, def.kind === "pickup" ? 8 : 14, {
        colour: [def.colour, def.glow || "#ffffff", "#ffffff"],
        speed: 260,
        life: 0.45,
        size: 4,
        gravity: 120,
        glow: true
      });
      this.addFloater(`+${def.score || 0}`, it.x, it.y - 24, def.colour, 16, 0.7);
      if (def.energy) this.addFloater(`+${def.energy} ENERGY`, it.x, it.y - 52, "#7ee8ff", 16, 0.75);
      if (this.score.tierIndex > 0 && Math.random() < 0.15) {
        this.audio?.sfx("combo", { pitch: 1 + this.score.tierIndex * 0.08, volume: 0.5 });
      }
    }
    touchEntities(dt) {
      const p = this.player;
      for (const it of this.world.itemsNear(p.x)) {
        if (it.taken) continue;
        const def = ITEM_DEFS[it.id];
        if (!def) continue;
        if (def.kind === "gate") {
          const d = Math.hypot(it.x - p.x, it.y - p.y);
          if (d < def.r + PHYS.collideRadius) {
            if (!it.cooldown || this.time - it.cooldown > 1.2) {
              it.cooldown = this.time;
              const ang = it.angle ?? -0.22;
              p.vx = Math.min(PHYS.maxVx, Math.max(p.vx, 900) + def.vx);
              p.vy = Math.max(-PHYS.maxVyUp, p.vy - def.impulse * 0.9 * Math.cos(ang));
              p.boostPulse = 1;
              this.audio?.sfx("rocket", { volume: 0.9 });
              this.camera.addShake(0.25);
              this.score.addPickup({ score: def.score, combo: def.combo });
              this.addFloater("JET GATE!", it.x, it.y - 60, "#ffb020", 24, 1);
              this.particles.burst(it.x, it.y, 20, { colour: ["#ffb020", "#ff7a1a", "#fff"], speed: 480, life: 0.5, size: 7, gravity: 0, glow: true });
            }
          }
        } else if (def.kind === "ride") {
          if (!p.rideUfo) {
            const d = Math.hypot(it.x - p.x, it.y - p.y);
            if (d < def.r + PHYS.collideRadius) {
              p.rideUfo = { x: it.x, y: it.y, vx: Math.max(760, p.vx * 0.8), timer: def.rideTime, phase: 0 };
              this.world.removeItem(it);
              this.score.addPickup({ score: def.score, combo: def.combo });
              this.audio?.sfx("glitch");
              this.addFloater("GLITCH UFO!", it.x, it.y - 70, "#c58bff", 26, 1.2);
              this.particles.burst(it.x, it.y, 18, { colour: ["#c58bff", "#7ee8ff"], speed: 420, life: 0.5, size: 6, gravity: 0, glow: true });
            }
          }
        }
      }
      if (p.invuln <= 0) {
        for (const h of this.world.hazardsNear(p.x)) {
          const d = Math.hypot(h.x - p.x, h.y - p.y);
          if (d < h.r + PHYS.collideRadius * 0.8) {
            p.energy = Math.max(0, p.energy - RUN.hazardEnergyLoss);
            p.invuln = 0.7;
            p.hurt = 0.6;
            p.vx = Math.max(600, p.vx * 0.72);
            p.vy = -480;
            this.score.breakCombo();
            this.audio?.sfx("hit");
            this.camera.addShake(0.5);
            this.screenFlash = 1;
            this.addFloater("OUCH! -" + RUN.hazardEnergyLoss + " ENERGY", p.x, p.y - 110, "#ff6b6b", 24, 1.2);
            this.particles.burst(p.x, p.y, 26, { colour: ["#ff4d6d", "#ffd93b"], speed: 520, life: 0.6, size: 7, gravity: 400, glow: true });
            break;
          }
        }
      }
    }
    // ------------------------------------------------------------------ boost
    tryBoost() {
      const p = this.player;
      if (!p || this.state !== "fly" && this.state !== "launch") return false;
      if (this.boostLock > 0) return false;
      if (p.boosts <= 0) {
        this.boostLock = 0.4;
        this.addFloater("NO BOOSTS LEFT — FIND A STAR", p.x, p.y - 100, "#ff9a9a", 20, 1);
        this.audio?.sfx("click", { volume: 0.5 });
        return false;
      }
      p.boosts--;
      this.runStats.boosts++;
      const coffee = p.buffs.coffee > 0 ? BOOST.coffeeMul : 1;
      const power = this.stats.boostMul * coffee;
      if (p.vy > BOOST.fallCancel) p.vy = BOOST.fallCancel * Math.min(1.25, power);
      else p.vy -= BOOST.extraUp * power;
      p.vx = Math.min(PHYS.maxVx, p.vx + BOOST.vxImpulse * power);
      p.boostPulse = 1;
      p.squash = 0.8;
      p.stretch = 1.25;
      p.lastBoostAt = 0;
      this.boostLock = BOOST.lockout;
      this.audio?.sfx("boost", { pitch: 1 + (coffee > 1 ? 0.16 : 0) });
      this.camera.addShake(0.34);
      this.camera.pulseZoom(0.035);
      const chain = this.score.addCombo(1);
      if (chain) this.onCombo(chain, p);
      if (p.lastPadAt < BOOST.comboWindow) {
        this.score.addSkillBonus(30, "BOOST CHAIN");
        this.addFloater("BOOST COMBO +30", p.x, p.y - 150, "#7ee8ff", 22, 1);
      }
      this.particles.burst(p.x - 30, p.y + 30, 30, {
        colour: ["#ffd93b", "#ff9f1c", "#ffffff", "#7ee8ff"],
        speed: 620,
        angle: Math.PI * 0.62,
        spread: 1.1,
        life: 0.65,
        size: 8,
        gravity: 260,
        glow: true
      });
      this.particles.spawn({ x: p.x, y: p.y + 20, vx: 0, vy: 0, life: 0.45, size: 120, colour: "#ffd93b", kind: "ring", gravity: 0, drag: 0, glow: true });
      this.screenFlash = Math.min(1, (this.screenFlash || 0) + 0.22);
      return true;
    }
    onCombo(chain, p) {
      if (!chain) return;
      if (chain.tierUp) {
        this.addFloater(chain.label, p.x + 40, p.y - 190, chain.colour, 34, 1.4, true);
        this.audio?.sfx("ding", { pitch: 1 + chain.tier * 0.07, volume: 0.8 });
        if (chain.tier >= 3) {
          this.audio?.sfx("ooh", { volume: 0.45 + Math.min(0.4, chain.tier * 0.05), crowd: Math.min(3, chain.tier - 1), pitch: 0.95 + chain.tier * 0.02 });
        }
        this.camera.addShake(0.18);
        this.particles.burst(p.x, p.y - 60, 18, {
          colour: [chain.colour, "#ffffff"],
          speed: 380,
          life: 0.7,
          size: 7,
          gravity: -40,
          glow: true,
          kind: "star"
        });
      }
    }
    // ------------------------------------------------------------------- death
    checkDeath() {
      const p = this.player;
      const floor = this.world.floorAt(p.x);
      const below = p.y > floor - 8;
      const lost = p.y > floor + 2600 || !Number.isFinite(p.x) || !Number.isFinite(p.y);
      if (below || lost) this.die(below ? "floor" : "void");
    }
    die(cause) {
      if (this.state === "dead") return;
      const p = this.player;
      this.state = "dead";
      this.deadTimer = 0;
      this.summarySent = false;
      p.animState = "dead";
      p.expression = "dead";
      p.rideUfo = null;
      this.audio?.sfx("dead");
      this.audio?.sfx("ooh", { volume: 0.6, crowd: 1, pitch: 0.78, dur: 1.25 });
      this.audio?.setScene("gameover");
      this.camera.addShake(0.8);
      this.camera.pulseZoom(0.05);
      this.particles.burst(p.x, p.y, 46, {
        colour: ["#ff6b4a", "#ffd93b", "#ffffff", "#c58bff"],
        speed: 700,
        life: 1.1,
        size: 9,
        gravity: 620,
        glow: true,
        jitter: 30
      });
      this.particles.burst(p.x, p.y, 18, {
        colour: "#e6e9f5",
        speed: 260,
        life: 1.6,
        size: 30,
        kind: "smoke",
        gravity: -30,
        drag: 1.8
      });
      const metres = this.score.metres;
      const sum = this.score.summary();
      const charId = this.characterId;
      const sa = this.save?.data;
      const prevBest = sa?.records?.best?.[charId]?.distance || 0;
      const newBest = metres > (sa?.records?.distance || 0);
      const newCharBest = metres > prevBest;
      const coinPayout = Math.floor(sum.coins + metres * ECONOMY.starCoinPerMeter + (newBest ? 50 : 0));
      const bonus = newCharBest ? Math.max(0, Math.floor(metres / 25)) : 0;
      this.summary = {
        ...sum,
        cause,
        character: charId,
        metres,
        coinsEarned: coinPayout + bonus,
        newBest,
        newCharBest,
        perfectLaunch: this.perfectLaunch,
        floorReached: floorName(metres),
        boostsUsed: this.runStats.boosts,
        springs: this.runStats.springs,
        skills: this.runStats.skills
      };
      this.slowmo = 0.5;
    }
    checkRegionChange() {
      const region = regionAt(this.score.metres);
      if (this.lastRegion !== region.id) {
        if (this.lastRegion) {
          this.addFloater(regionLabel(region, false), this.player.x + 420, this.player.y - 240, region.hue, 34, 2.6, true);
          this.audio?.sfx("ding", { pitch: 1.1, volume: 0.8 });
          this.camera.addShake(0.2);
          this.particles.burst(this.player.x + 200, this.player.y - 120, 26, {
            colour: [region.hue, "#ffffff"],
            speed: 420,
            life: 1,
            size: 8,
            gravity: -30,
            glow: true,
            kind: "star"
          });
        }
        this.lastRegion = region.id;
        this.onEvent("region", region);
      }
    }
    // ---------------------------------------------------------------- effects
    addFloater(text, x, y, colour = "#fff", size = 24, life = 1, big = false) {
      this.floaters.push({ text, x, y, colour, size, life, maxLife: life, vy: -62, big });
      if (this.floaters.length > 26) this.floaters.shift();
    }
    updateFloaters(dt) {
      for (let i = this.floaters.length - 1; i >= 0; i--) {
        const f = this.floaters[i];
        f.life -= dt;
        f.y += f.vy * dt;
        f.vy *= 1 - damp(1.6, dt);
        if (f.life <= 0) this.floaters.splice(i, 1);
      }
    }
    updateEffects(dt) {
      this.screenFlash = Math.max(0, (this.screenFlash || 0) - dt * 3.2);
      this.slowmo = Math.max(0, this.slowmo - dt);
      if (this.audio) {
        this.audio.sfxVolume = 1;
      }
    }
    get region() {
      return regionAt(this.state === "launch" ? 0 : this.score.metres);
    }
    get distanceLabel() {
      return formatMeters(this.score.metres);
    }
    /** Data for the minimap. */
    minimapData() {
      if (!this.player) return null;
      const px = this.player.x;
      const span = 5200;
      const pads = [];
      for (const chunk of this.world.chunksNear(px, 0, 3)) {
        for (const pad of chunk.pads) {
          if (pad.rescue) continue;
          if (pad.x > px - 400 && pad.x < px + span) pads.push({ x: pad.x, y: pad.y });
        }
      }
      return {
        playerX: px,
        playerY: this.player.y,
        vx: this.player.vx,
        pads,
        span,
        metres: this.score.metres,
        region: this.region,
        regions: REGIONS
      };
    }
  };
  function floorName(metres) {
    return regionAt(metres).short;
  }

  // src/game/music.js
  var PROG = {
    // Am - F - C - G  (the classic four-chord EDM loop)
    house: [
      { root: 45, notes: [0, 3, 7, 10] },
      // Am7
      { root: 41, notes: [0, 4, 7, 11] },
      // Fmaj7
      { root: 48, notes: [0, 4, 7, 11] },
      // Cmaj7
      { root: 43, notes: [0, 4, 7, 10] }
      // G7
    ],
    // Am - C - F - G, brighter, for the fast flight loops
    drive: [
      { root: 45, notes: [0, 3, 7, 12] },
      { root: 48, notes: [0, 4, 7, 12] },
      { root: 41, notes: [0, 4, 7, 12] },
      { root: 43, notes: [0, 4, 7, 12] }
    ],

  function handleGameOver(summary) {
    const data = save.data;
    const charId = summary.character;
    data.coins += summary.coinsEarned;
    data.totalRuns += 1;
    data.records.coinsEarned += summary.coinsEarned;
    data.records.distance = Math.max(data.records.distance, summary.metres);
    data.records.score = Math.max(data.records.score, summary.score);
    data.records.combo = Math.max(data.records.combo, summary.bestCombo);
    data.records.best[charId] = data.records.best[charId] || { distance: 0, score: 0, runs: 0 };
    const b = data.records.best[charId];
    b.distance = Math.max(b.distance, summary.metres);
    b.score = Math.max(b.score, summary.score);
    b.runs += 1;
    data.records.history.unshift({
      character: charId,
      distance: summary.metres,
      score: summary.score,
      combo: summary.bestCombo,
      coins: summary.coinsEarned,
      date: Date.now()
    });
    data.records.history = data.records.history.slice(0, 8);
    data.stats.orbs += Math.round(summary.pickups || 0);
    data.stats.boosts += summary.boostsUsed || 0;
    data.stats.springs += summary.springs || 0;
    data.stats.skills += summary.skills || 0;
    const a = data.achievements;
    a.first_flight = true;
    if (summary.metres >= 500) a.five_hundred = true;
    if (summary.metres >= 2e3) a.two_thousand = true;
    if (summary.metres >= 5e3) a.five_thousand = true;
    if (summary.metres >= 15e3) a.fifteen_thousand = true;
    if (summary.metres >= 25e3) a.scientist = true;
    if (summary.bestCombo >= 15) a.combo_insane = true;
    if ((summary.boostsUsed || 0) >= 10) a.boost_master = true;
    if ((summary.springs || 0) >= 12) a.spring_chain = true;
    if (CHARACTER_IDS.every((id) => data.unlocked[id])) a.all_characters = true;
    save.save();
    refreshMenu();
    $("#goRibbon").textContent = summary.newBest ? "NEW WORLD RECORD" : "EXPERIMENT FAILED";
    $("#goRibbon").classList.toggle("is-record", !!summary.newBest);
    $("#goTitle").textContent = summary.cause === "floor" ? "SPLAT." : "LOST IN SPACE.";

      return `<div class="map-region"><span class="dot" style="background:${r.hue};opacity:${reached ? 1 : 0.25}"></span>
        <span style="opacity:${reached ? 1 : 0.5}">${regionLabel(r, false)}</span>
        <b>${r.to === Infinity ? "∞" : r.to.toLocaleString("en-US") + " m"}</b></div>`;
    }).join("")}
    <p class="modal-sub" style="margin-top:10px">${t("map.current")}: <b style="color:#ffe86b">${formatMeters(m)}</b> · ${regionLabel(game.region, false)}</p>
  `;
  }
  function bindInput() {
    window.addEventListener("keydown", (e) => {
      if (e.code === "Escape") {
        if (uiState.screen === "pause") {
          resumeGame();
          e.preventDefault();
        } else if (uiState.screen === "gameover") {
          quitToMenu();
        } else if (!uiState.screen && game.isRunning()) {
          pauseGame();
          e.preventDefault();
        } else if (uiState.screen && ["characters", "upgrades", "records", "settings"].includes(uiState.screen)) {
          showScreen("menu");
        }
      }
      if (e.code === "Enter") {
        if (uiState.screen === "gameover") startRun();
        else if (uiState.screen === "menu") startRun();
        else if (uiState.screen === null && game.state === "launch") game.fireLaunch();
      }
      if (e.code === "KeyZ" && !uiState.screen) {
        const order = ["normal", "wide", "ultra"];
        const next = order[(order.indexOf(save.data.settings.view) + 1) % order.length];
        save.data.settings.view = next;
        game.setViewMode(next);
        save.save();
        toast(t("toast.view", { mode: t(`set.view.${next}`) }), 1e3, "#7ee8ff");
        e.preventDefault();
      }
      if (e.code === "KeyF") {
        toggleFullscreen();
        e.preventDefault();
      }
      if (e.code === "KeyM" && !uiState.screen) {
        audio.setMuted(!audio.muted);
        toast(audio.muted ? t("toast.muted") : t("toast.soundOn"), 900);
      }
    });
    $("#pauseBtn").addEventListener("click", () => pauseGame());
    $("#fsBtn").addEventListener("click", () => toggleFullscreen());
    window.addEventListener("mousedown", (e) => {
      if (e.button !== 2 || uiState.screen) return;
      e.preventDefault();
      audio.unlock();
      input.setVirtual("skill", true);
    });
    window.addEventListener("mouseup", (e) => {
      if (e.button === 2) input.setVirtual("skill", false);
    });
    window.addEventListener("contextmenu", (e) => {
      if (!uiState.screen) e.preventDefault();
    });
    for (const btn of $$("[data-touch]")) {
      const action = btn.dataset.touch;
      const down = (e) => {
        e.preventDefault();
        audio.unlock();
        btn.classList.add("is-down");
        input.setVirtual(action, true);
        if (btn.setPointerCapture && e.pointerId != null) {
          try {
            btn.setPointerCapture(e.pointerId);
          } catch (_) {
          }
        }
        if (action === "boost" && game.state === "launch") {
        }
      };
      const up = (e) => {
        e.preventDefault();
        btn.classList.remove("is-down");
        input.setVirtual(action, false);
      };
      btn.addEventListener("pointerdown", down);
      btn.addEventListener("pointerup", up);
      btn.addEventListener("pointercancel", up);
      btn.addEventListener("pointerleave", (e) => {
        if (e.buttons === 0) return;
        up(e);
      });
      btn.addEventListener("contextmenu", (e) => e.preventDefault());
    }
    document.body.addEventListener("click", (e) => {
      const t2 = e.target.closest("[data-action]");
      if (!t2) return;
      const action = t2.dataset.action;
      audio.unlock();
      audio.sfx("click", { volume: 0.6 });
      switch (action) {
        case "play":
          startRun();
          break;
        case "fullscreen":
          toggleFullscreen();
          break;
        case "lang": {
          const order = ["vi", "en"];
          const next = order[(order.indexOf(getLang()) + 1) % order.length];
          applyLanguage(next);
          break;
        }
        case "newtab":
          openInNewTab();
          break;
        case "characters":
          showScreen("characters");
          break;
        case "upgrades":
          uiState.charTab = save.data.selected;
          showScreen("upgrades");
          break;
        case "records":
          showScreen("records");
          break;
        case "settings":
          uiState.prevSettings = uiState.screen;
          showScreen("settings");
          break;
        case "menu":
          quitToMenu();
          break;
        case "back":
          showScreen(uiState.prevSettings === "pause" ? "pause" : "menu");
          break;
        case "resume":
          resumeGame();
          break;
        case "restart":
          startRun();
          break;
        case "map":
          openJourneyMap();
          break;
        case "retry":
          startRun();
          break;
        case "quit":
          quitToMenu();
          break;
        default:
          break;
      }
    });
    window.addEventListener("blur", () => {
      if (!uiState.screen && game.isRunning()) pauseGame();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && !uiState.screen && game.isRunning()) pauseGame();
    });
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 120));
  }
  var loop = new Loop({
    step: 1 / 120,
    update: (dt, now) => {
      if (uiState.screen === null || game.state === "dead") {
        if (game.state !== "paused") game.update(dt, now * 1, input);
      }
      input.endFrame(game.time);
    },
    render: (dt, now) => {
      const t2 = now;
      if (uiState.screen === "menu" || uiState.screen === "characters" || uiState.screen === "records" || uiState.screen === "upgrades" || uiState.screen === "settings") {
        renderBackdrop(t2);
        if (uiState.screen === "menu") drawLogoFrame();
        drawCharacterPortraits(t2);
        drawUpgradePortrait(t2);
      } else {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const touchMode = $("#touchControls").classList.contains("is-on");
        const hudInset = 62;
        renderScene(ctx, game, cssW, cssH, t2, save.data.settings.quality, { touchMode, hudInset });
      }
      $("#fpsReadout").textContent = `${Math.round(loop.fps)} fps`;
    }
  });
  loop.onSecond = (fps) => {
    if (fps < 45 && save.data.settings.quality === "high") {
      save.data.settings.quality = "balanced";
      save.save();
      game.setQuality("balanced");
      resize();
      toast(t("toast.autoQuality"), 1800, "#ffd93b");
    }
  };
  function init() {
    applyI18n(document);
    $("#menuLang").textContent = getLang() === "vi" ? "VI" : "EN";
    resize();
    game.setQuality(save.data.settings.quality);
    game.setCharacter(save.data.selected, save.data.upgrades);
    game.state = "idle";
    game.setViewMode(save.data.settings.view);
    bindInput();
    bindSettings();
    bindStandaloneGate();
    onLangChange(() => audio.sfx("click"));
    refreshMenu();
    refreshSettings();
    showScreen("menu");
    $("#fpsReadout").classList.toggle("is-on", !!save.data.settings.showFps);
    audio.setScene("menu");
    audio.applySettings(save.data.settings);
    const kick = () => audio.unlock();
    window.addEventListener("pointerdown", kick, { once: true });
    window.addEventListener("keydown", kick, { once: true });
    setTimeout(() => $("#loading").classList.add("is-done"), 450);
    loop.start();
    window.JTTS = {
      game,
      save,
      audio,
      input,
      startRun,
      showScreen,
      get screen() {
        return uiState.screen;
      },
      version: "1.0.0"
    };
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
